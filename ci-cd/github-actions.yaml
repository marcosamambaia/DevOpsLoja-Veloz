name: CI/CD Loja Veloz

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Instalar dependências e rodar testes
        run: |
          cd api-gateway && npm install && npm test
          cd ../pedidos-service && npm install && npm test
          cd ../pagamentos-service && npm install && npm test
          cd ../estoque-service && npm install && npm test

  lint-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Validar YAML dos manifests
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint infra/k8s/
      - name: Scan de vulnerabilidades nas imagens
        run: |
          docker build -t loja-veloz/api-gateway:scan api-gateway/
          docker scan loja-veloz/api-gateway:scan --severity high

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Login no Registry
        run: |
          echo "${{ secrets.REGISTRY_PASS }}" | docker login -u ${{ secrets.REGISTRY_USER }} --password-stdin
      - name: Build & Push API Gateway
        run: |
          docker build -t loja-veloz/api-gateway:${{ github.sha }} api-gateway/
          docker push loja-veloz/api-gateway:${{ github.sha }}
      - name: Build & Push Pedidos Service
        run: |
          docker build -t loja-veloz/pedidos-service:${{ github.sha }} pedidos-service/
          docker push loja-veloz/pedidos-service:${{ github.sha }}
      - name: Build & Push Pagamentos Service
        run: |
          docker build -t loja-veloz/pagamentos-service:${{ github.sha }} pagamentos-service/
          docker push loja-veloz/pagamentos-service:${{ github.sha }}
      - name: Build & Push Estoque Service
        run: |
          docker build -t loja-veloz/estoque-service:${{ github.sha }} estoque-service/
          docker push loja-veloz/estoque-service:${{ github.sha }}

  validate-kubeconfig:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: Testar conexão com cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -n loja-veloz

  deploy:
    runs-on: ubuntu-latest
    needs: validate-kubeconfig
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: Aplicar manifests no cluster
        run: |
          kubectl apply -f infra/k8s/ -n loja-veloz
          kubectl rollout status deployment/api-gateway -n loja-veloz
