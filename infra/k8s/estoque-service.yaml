apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque-service
  namespace: loja-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estoque-service
  template:
    metadata:
      labels:
        app: estoque-service
    spec:
      containers:
        - name: estoque-service
          image: estoque-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: loja-veloz-config
            - secretRef:
                name: loja-veloz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: loja-veloz
spec:
  selector:
    app: estoque-service
  ports:
    - port: 3003
      targetPort: 3003
